# Sample operator configuration (non-secret). Copy or pass --config data/sample-config.yaml
# Replace placeholder values with your Snyk group and policy. Secrets (SNYK_TOKEN, Azure PAT)
# stay in environment variables or Key Vault — never put them in this file.

azure_boards:
  # Repo-level area path / assignee routing CSV.
  # Default (when omitted): repo-mapping.csv beside this file. sync fails at startup if that file is missing.
  # Set repo_mapping_csv: "" to disable CSV routing and use YAML area_path only (see defaults below).
  # See data/sample-repo-mapping.csv and CONFIGURATION.md. Co-locate on Azure Files with config.yaml.
  # repo_mapping_csv: repo-mapping.csv
  # repo_mapping_csv: ""
  # Per-ADO-project work item taxonomy when repo-mapping.csv routes to multiple projects.
  # Define one entry per distinct (organization, project) from CSV Area Path first segments.
  # ado_targets:
  #   - organization: "your-azure-devops-org"
  #     project: "PaymentsProject"
  #     work_item_type: Bug
  #     work_item_state_active: New
  #     work_item_state_closed: Closed
  defaults:
    # Routing for group-scoped sync (when org_mappings is absent): ADO org/project names.
    organization: "your-azure-devops-org"
    project: "your-azure-devops-project"
    create_new_work_items: true
    # Minimum severity for listing issues (Snyk Issues API effective_severity_level).
    severity_threshold: high
    # historical | <ISO-8601 timestamp> — limit which issues are considered for sync.
    issues_sync_from: historical
    # When true, only create work items when the issue indicates a fix is available.
    create_only_when_fix_available: false
    # new_work_item | reopen_existing — behavior when a mapped work item is missing in ADO.
    reopen_work_item_policy: new_work_item
    work_item_type: Task
    work_item_state_active: New
    work_item_state_closed: Closed
    # Optional YAML area path fallback (does not require a CSV file when repo_mapping_csv: "").
    # When CSV routing is enabled: used only when no repo-mapping.csv row matches this issue
    # (precedence: CSV row → org_mappings[].overrides.area_path → defaults.area_path → ADO default).
    # area_path: "MyProject\\TeamA"
    # Omit work_item_description_field: sync auto-uses System.Description, then
    # Microsoft.VSTS.TCM.ReproSteps when Description is not on the work item type.
    # work_item_description_field: Microsoft.VSTS.TCM.ReproSteps  # explicit (e.g. Bug)
    # Optional: inclusive allowlist of Snyk project origins (see README). Omit = all origins.
    # Example (sync Git-integrated projects only, exclude CLI): sync_included_snyk_origins: "github,azure-repos,gitlab"
    # sync_included_snyk_origins: ""
    # Optional: plain text appended after the auto-generated work item description (one extra block).
    # work_item_description_appendix: |
    #   Internal: request Snyk access at https://example.internal/access
    work_item_template:
      tags:
        - Snyk
      # json_patch: []

  # For canonical app.snyk.io links in work items, use org_mappings below with snyk_org_slug per row.
  # Group-scoped sync (this layout) does not configure an org slug; links may be incomplete until then.
  # Work item type, states, and description field must match your ADO process.
  # Bug (Agile/Scrum) often uses Repro Steps; omit work_item_description_field to auto-select.

  # Multi-target sync (optional): each row maps one ADO org/project to one Snyk org UUID.
  # Uncomment and edit when using org-scoped issue listing instead of a single group_id scope.
  # org_mappings:
  #   - organization: "your-azure-devops-org"
  #     project: "your-azure-devops-project"
  #     snyk_org_id: "00000000-0000-0000-0000-000000000002"
  #     snyk_org_slug: "your-snyk-org-slug"
  #     overrides:
  #       severity_threshold: critical
  #       # Optional per-target origin allowlist (overrides azure_boards.defaults.sync_included_snyk_origins).
  #       # sync_included_snyk_origins: "github,gitlab"
  #       work_item_type: Task
      #       # Per-org YAML area path when CSV is enabled but has no row for this issue.
      #       # area_path: "MyProject\\TeamB"
  #       # work_item_description_appendix: "Note for this ADO project only."
  #       # work_item_template:
  #       #   tags: ["TeamA"]

snyk:
  group_id: "00000000-0000-0000-0000-000000000001"
  # Optional: Snyk API origin for your region (default SNYK-US-01: https://api.snyk.io).
  # REST calls use {origin}/rest. See CONFIGURATION.md and Snyk regional API URL docs.
  # api_base_url: https://api.snyk.io
  # Optional: Snyk web app origin for work item links (default SNYK-US-01: https://app.snyk.io).
  # See CONFIGURATION.md and Snyk regional hosting URL docs.
  # app_base_url: https://app.snyk.io

# Local mapping DB for dev/tests (non-secret). Do not put tokens or PATs in this path.
mapping_store: sqlite
sqlite_path: data/mapping_store.sqlite
